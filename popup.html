<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follow-Up Reminders</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <h1>Follow-Up Reminders</h1>
    </div>
    <div class="popup-tabs">
      <button class="tab-btn active" data-tab="pending">Pending</button>
      <button class="tab-btn" data-tab="completed">Completed</button>
    </div>
    <div id="reminder-list" class="reminder-list"></div>
    <div id="empty-state" class="empty-state" style="display: none;">
      <p class="empty-icon">&#128237;</p>
      <p class="empty-text">No reminders yet</p>
      <p class="empty-sub">Send an email from Gmail to get started</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
